name: Publish existing IPTVPlayer APK

on:
  push:
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from successful build #4
        uses: actions/download-artifact@v4
        with:
          name: IPTVPlayer-debug-apk
          path: dist
          repository: ${{ github.repository }}
          run-id: 45923319003
          github-token: ${{ github.token }}

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/IPTVPlayer-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::No se encontró el APK de la ejecución 4."
            find dist -maxdepth 3 -type f -print
            exit 1
          fi
          file "$APK"
          ls -lh "$APK"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.5"
          gh release create "$TAG" "dist/IPTVPlayer-debug.apk"             --repo "$GITHUB_REPOSITORY"             --title "IPTVPlayer $TAG"             --notes "APK de la compilación verificada en la ejecución 4."
