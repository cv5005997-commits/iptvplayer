name: Build IPTVPlayer APK

on:
  push:
    paths:
      - 'IptvPlayer.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          unzip -q IptvPlayer.zip -d source
          SETTINGS="$(find source -type f \\( -name settings.gradle -o -name settings.gradle.kts \\) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::No se encontró settings.gradle ni settings.gradle.kts dentro del ZIP."
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(realpath "$(dirname "$SETTINGS")")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          SDK_LEVEL="$(grep -RhoE 'compileSdk(Version)?[[:space:]]*[=: (]+[0-9]+' "$PROJECT_DIR" --include='*.gradle' --include='*.gradle.kts' | grep -oE '[0-9]+' | tail -1 || true)"
          if [ -z "$SDK_LEVEL" ]; then SDK_LEVEL=35; fi
          echo "Instalando Android SDK platform $SDK_LEVEL"
          "$SDKMANAGER" --install "platform-tools" "platforms;android-$SDK_LEVEL"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: gradle --no-daemon clean assembleDebug

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::La compilación terminó sin generar ningún APK."
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/IPTVPlayer-debug.apk"
          test -s "$GITHUB_WORKSPACE/IPTVPlayer-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/IPTVPlayer-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-debug-apk
          path: IPTVPlayer-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" IPTVPlayer-debug.apk \\
            --repo "$GITHUB_REPOSITORY" \\
            --title "IPTVPlayer $TAG" \\
            --notes "APK generado y verificado automáticamente desde IptvPlayer.zip."
