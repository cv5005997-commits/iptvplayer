name: Build IPTVPlayer APK

on:
  push:
    paths:
      - 'IptvPlayer.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          unzip -q IptvPlayer.zip -d source
          SETTINGS="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::No se encontró settings.gradle ni settings.gradle.kts dentro del ZIP."
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(realpath "$(dirname "$SETTINGS")")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"
          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::El proyecto no incluye gradlew."
            exit 1
          fi
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::La compilación terminó sin generar ningún APK."
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/IPTVPlayer-debug.apk"
          test -s "$GITHUB_WORKSPACE/IPTVPlayer-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/IPTVPlayer-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-debug-apk
          path: IPTVPlayer-debug.apk
          if-no-files-found: error
